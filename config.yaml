main:
  universe: ["AAPL","MSFT","NVDA","AMZN","GOOGL","META","ORCL","TSM","BTC-USD","SOL-USD","MATIC-USD"]
  timeframe: "1d"
  start_date: "2018-01-01"
  end_date: null
  base_currency: "USD"
  initial_cash: 100000
  strategy: "ma_crossover"
  save_dataset: true

rebalance:
  lookback_days: 126        # ~6 mesi
  skip_recent_days: 5       # evita l’ultimissima settimana
  top_n: 6
  min_momentum: -1.0
  target_weight: "momentum"   # "equal" oppure **"momentum"**
  trade_unit: 10

  # --- Nuovi parametri rischio / sizing ---
  dd_window_days: 126         # finestra per drawdown recente
  dd_limit: 0.35               # escludi se drawdown recente < -35% (cioè >35% in valore assoluto)
  vol_window_days: 20          # finestra per volatilità (std su rendimenti giornalieri)
  max_weight: 0.30             # peso massimo per singolo asset
  min_weight: 0.05             # peso minimo (solo se selezionato nei top)


paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  outputs: "outputs"
