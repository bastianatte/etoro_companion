main:
  universe: ["AAPL","MSFT","NVDA","AMZN","GOOGL","META","ORCL","TSM","BTC-USD","SOL-USD","MATIC-USD"]
  timeframe: "1d"
  start_date: "2018-01-01"
  end_date: null
  base_currency: "USD"
  initial_cash: 100000
  strategy: "ma_crossover"
  save_dataset: true

rebalance:
  lookback_days: 126        # ~6 mesi
  skip_recent_days: 5       # evita l’ultimissima settimana
  top_n: 6
  min_momentum: -1.0
  target_weight: "momentum"   # "equal" oppure **"momentum"**
  trade_unit: 10

  # --- Nuovi parametri rischio / sizing ---
  dd_window_days: 126         # finestra per drawdown recente
  dd_limit: 0.35               # escludi se drawdown recente < -35% (cioè >35% in valore assoluto)
  vol_window_days: 20          # finestra per volatilità (std su rendimenti giornalieri)
  max_weight: 0.30             # peso massimo per singolo asset
  min_weight: 0.05             # peso minimo (solo se selezionato nei top)


paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  outputs: "outputs"

# --- Trader autonomo (regole fisse, applicate dal codice in trader/rules.py) ---
trader:
  leverage: 1                  # mai leva
  allow_short: false           # solo acquisti
  max_position_weight: 0.25    # max 25% del conto su un singolo strumento
  min_order_usd: 20            # eToro minimo $10, ma la vendita costa ~$1 fisso: sotto $20 non conviene
  stop_loss_min_pct: 0.05      # stop-loss obbligatorio tra -5% ...
  stop_loss_max_pct: 0.25      # ... e -25% dal prezzo corrente
  max_orders_per_day: 3        # acquisti + vendite
  max_orders_per_week: 5
  min_equity_usd: 140          # sotto questa soglia: niente nuovi acquisti (solo vendite)
  blocked_exchanges: ["CFD"]   # niente CFD
  blocked_keywords: ["Anthropic"]   # conflitto di interessi: Claude è fatto da Anthropic
